name: Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Valider le contrat du dépôt
        run: python3 scripts/validate_repository.py

      - name: Valider le pilote ROI IA
        run: python3 scripts/validate_roi_pilot.py measurement/KPI-SELECTION.yml --observations measurement/OBSERVATIONS.jsonl

      - name: Tester les validateurs génériques Python
        run: python3 -m unittest discover -s tests -v

      - name: Tester le service APISIX
        run: python3 -m unittest discover -s services/APISIX/tests -v

      - name: Vérifier la syntaxe Bash
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find . -type f -name '*.sh' -print0)

      - name: Tester le générateur
        run: bash tests/test-generator.sh

      - name: Valider un assemblage Compose représentatif
        shell: bash
        run: |
          tmp_dir="$(mktemp -d)"
          COMPOSE_OUTPUT="$tmp_dir/docker-compose.yml" \
          ENV_OUTPUT="$tmp_dir/.env" \
            ./scripts/generate-docker-compose.sh Nginx-Proxy-Manager Odoo N8N
          docker compose --env-file "$tmp_dir/.env" -f "$tmp_dir/docker-compose.yml" config --quiet

      - name: Valider toutes les variantes Compose
        shell: bash
        run: |
          while IFS= read -r compose_file; do
            selection="$(dirname "${compose_file#services/}")"
            docker compose \
              --env-file "$(dirname "$compose_file")/.env.example" \
              -f "$compose_file" \
              config --quiet
            tmp_dir="$(mktemp -d)"
            COMPOSE_OUTPUT="$tmp_dir/docker-compose.yml" \
            ENV_OUTPUT="$tmp_dir/.env" \
              ./scripts/generate-docker-compose.sh "$selection"
            docker compose --env-file "$tmp_dir/.env" -f "$tmp_dir/docker-compose.yml" config --quiet
          done < <(find services -type f \( -name docker-compose.yml -o -name dockercompose.yml \) | sort)
