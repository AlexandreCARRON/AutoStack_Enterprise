services:
   #******************************** STIRLING PDF (NON TESTé !!!) ****************************************************************************************************

  stirling-pdf:
      image: frooodle/s-pdf:latest
      ports:
        - '${PORT_SPDF}:8080'
      volumes:
        - ${AUTOSTACK_Z_STIRLING_PDF_DIR:-..}/volumes/trainingData:/usr/share/tessdata #Required for extra OCR languages
        - ${AUTOSTACK_Z_STIRLING_PDF_DIR:-..}/volumes/extraConfigs:/configs
        - ${AUTOSTACK_Z_STIRLING_PDF_DIR:-..}/volumes/customFiles:/customFiles/
        - ${AUTOSTACK_Z_STIRLING_PDF_DIR:-..}/volumes/logs:/logs/
      environment:
  #      - DOCKER_ENABLE_SECURITY=false              attention a été enlevé car pas confiance, peut être à activer obligatoirement
  #      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=false   attention a été enlevé car pas confiance, peut être à activer obligatoirement
        - LANGS=fr_FR
