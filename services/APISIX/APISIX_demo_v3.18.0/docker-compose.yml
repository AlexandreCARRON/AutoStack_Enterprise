services:
  apisix-etcd:
    image: ${APISIX_ETCD_IMAGE:?Définir APISIX_ETCD_IMAGE}
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=apisix-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://apisix-etcd:2379
    volumes:
      - apisix_demo_etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - apisix-control
    security_opt:
      - no-new-privileges:true

  apisix:
    image: ${APISIX_IMAGE:?Définir APISIX_IMAGE}
    restart: unless-stopped
    environment:
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?Définir APISIX_ADMIN_KEY}
    volumes:
      - ./services/APISIX/APISIX_demo_v3.18.0/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports:
      - "${APISIX_HTTP_BIND_ADDRESS:-0.0.0.0}:${APISIX_HTTP_PORT:-9080}:9080/tcp"
      - "${APISIX_HTTPS_BIND_ADDRESS:-0.0.0.0}:${APISIX_HTTPS_PORT:-9443}:9443/tcp"
      - "${APISIX_ADMIN_BIND_ADDRESS:-127.0.0.1}:${APISIX_ADMIN_PORT:-9180}:9180/tcp"
    depends_on:
      apisix-etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "apisix", "status"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - apisix-control
      - demo-management
      - demo-entry
      - demo-si-entry
      - demo-internal
      - demo-partner
      - demo-observability
    security_opt:
      - no-new-privileges:true

  internal-api:
    build:
      context: ./services/APISIX/APISIX_demo_v3.18.0/demo-api
      args:
        DEMO_API_IMAGE: ${DEMO_API_IMAGE:-python:3.12-slim-bookworm}
    restart: unless-stopped
    user: "${DEMO_HOST_UID:-1000}:${DEMO_HOST_GID:-1000}"
    environment:
      DEMO_API_ROLE: internal
      DEMO_API_PORT: "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - demo-internal
    security_opt:
      - no-new-privileges:true

  partner-api:
    build:
      context: ./services/APISIX/APISIX_demo_v3.18.0/demo-api
      args:
        DEMO_API_IMAGE: ${DEMO_API_IMAGE:-python:3.12-slim-bookworm}
    restart: unless-stopped
    user: "${DEMO_HOST_UID:-1000}:${DEMO_HOST_GID:-1000}"
    environment:
      DEMO_API_ROLE: partner
      DEMO_API_PORT: "${DEMO_PARTNER_PORT:-8443}"
      DEMO_PARTNER_BACKEND_API_KEY: ${DEMO_PARTNER_BACKEND_API_KEY:?Définir DEMO_PARTNER_BACKEND_API_KEY}
      DEMO_TLS_CERT: /certs/partner-server.crt
      DEMO_TLS_KEY: /certs/partner-server.key
      DEMO_TLS_CLIENT_CA: /certs/demo-ca.crt
    volumes:
      - ./services/APISIX/APISIX_demo_v3.18.0/runtime/certs/demo-ca.crt:/certs/demo-ca.crt:ro
      - ./services/APISIX/APISIX_demo_v3.18.0/runtime/certs/partner-server.crt:/certs/partner-server.crt:ro
      - ./services/APISIX/APISIX_demo_v3.18.0/runtime/certs/partner-server.key:/certs/partner-server.key:ro
      - ./services/APISIX/APISIX_demo_v3.18.0/runtime/certs/apisix-client.crt:/certs/apisix-client.crt:ro
      - ./services/APISIX/APISIX_demo_v3.18.0/runtime/certs/apisix-client.key:/certs/apisix-client.key:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,ssl,urllib.request;
          c=ssl.create_default_context(cafile='/certs/demo-ca.crt');
          c.load_cert_chain('/certs/apisix-client.crt','/certs/apisix-client.key');
          r=urllib.request.Request('https://partner-api:'+os.environ['DEMO_API_PORT']+'/health',headers={'X-Partner-Api-Key':os.environ['DEMO_PARTNER_BACKEND_API_KEY']});
          urllib.request.urlopen(r,context=c,timeout=2)"
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s
    networks:
      demo-partner:
        aliases:
          - ${DEMO_PARTNER_HOST:-backend-partenaire-a.toto.local}
    security_opt:
      - no-new-privileges:true

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_STACK_VERSION:-9.4.2}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms768m -Xmx768m
    mem_limit: ${ELASTICSEARCH_MEMORY:-1536m}
    volumes:
      - apisix_demo_elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_BIND_ADDRESS:-127.0.0.1}:${ELASTICSEARCH_PORT:-9200}:9200/tcp"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - demo-management
      - demo-observability

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_STACK_VERSION:-9.4.2}
    restart: unless-stopped
    environment:
      LS_JAVA_OPTS: -Xms384m -Xmx384m
      XPACK_MONITORING_ENABLED: "false"
    mem_limit: ${LOGSTASH_MEMORY:-768m}
    volumes:
      - ./services/APISIX/APISIX_demo_v3.18.0/logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - demo-observability

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_STACK_VERSION:-9.4.2}
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
    mem_limit: ${KIBANA_MEMORY:-1024m}
    ports:
      - "${KIBANA_BIND_ADDRESS:-127.0.0.1}:${KIBANA_PORT:-5601}:5601/tcp"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - demo-management
      - demo-observability

  partner-client:
    image: ${DEMO_API_IMAGE:-python:3.12-slim-bookworm}
    profiles: ["tools"]
    restart: "no"
    environment:
      TARGET_URL: http://apisix:9080/api/interne/orders
      API_KEY: ${DEMO_PARTNER_API_KEY:?Définir DEMO_PARTNER_API_KEY}
      EXPECTED_STATUS: "200"
    volumes:
      - ./services/APISIX/APISIX_demo_v3.18.0/demo-client/client.py:/demo/client.py:ro
    entrypoint: ["python", "/demo/client.py"]
    networks:
      - demo-entry
    security_opt:
      - no-new-privileges:true

  si-client:
    image: ${DEMO_API_IMAGE:-python:3.12-slim-bookworm}
    profiles: ["tools"]
    restart: "no"
    environment:
      TARGET_URL: http://apisix:9080/partenaire-a/status
      API_KEY: ${DEMO_INTERNAL_API_KEY:?Définir DEMO_INTERNAL_API_KEY}
      EXPECTED_STATUS: "200"
    volumes:
      - ./services/APISIX/APISIX_demo_v3.18.0/demo-client/client.py:/demo/client.py:ro
    entrypoint: ["python", "/demo/client.py"]
    networks:
      - demo-si-entry
    security_opt:
      - no-new-privileges:true

  demo-configurator:
    image: ${DEMO_API_IMAGE:-python:3.12-slim-bookworm}
    profiles: ["tools"]
    restart: "no"
    environment:
      APISIX_ADMIN_URL: http://apisix:9180
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?Définir APISIX_ADMIN_KEY}
      DEMO_PARTNER_API_KEY: ${DEMO_PARTNER_API_KEY:?Définir DEMO_PARTNER_API_KEY}
      DEMO_INTERNAL_API_KEY: ${DEMO_INTERNAL_API_KEY:?Définir DEMO_INTERNAL_API_KEY}
      DEMO_PARTNER_BACKEND_API_KEY: ${DEMO_PARTNER_BACKEND_API_KEY:?Définir DEMO_PARTNER_BACKEND_API_KEY}
      KIBANA_URL: http://kibana:5601
      LOGSTASH_URL: http://logstash:8080
    volumes:
      - ./services/APISIX/APISIX_demo_v3.18.0/bootstrap/bootstrap.py:/demo/bootstrap.py:ro
      - ./services/APISIX/APISIX_demo_v3.18.0/runtime/generated:/demo/generated:ro
      - ./services/APISIX/APISIX_demo_v3.18.0/runtime/certs/apisix-client.crt:/demo/certs/apisix-client.crt:ro
      - ./services/APISIX/APISIX_demo_v3.18.0/runtime/certs/apisix-client.key:/demo/certs/apisix-client.key:ro
    command: ["python", "/demo/bootstrap.py"]
    depends_on:
      apisix:
        condition: service_healthy
      internal-api:
        condition: service_healthy
      partner-api:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      logstash:
        condition: service_started
      kibana:
        condition: service_started
    networks:
      - demo-entry
      - demo-internal
      - demo-partner
      - demo-observability
    security_opt:
      - no-new-privileges:true

volumes:
  apisix_demo_etcd_data:
  apisix_demo_elasticsearch_data:

networks:
  demo-management:
  apisix-control:
    internal: true
  demo-entry:
    internal: true
  demo-si-entry:
    internal: true
  demo-internal:
    internal: true
  demo-partner:
    internal: true
  demo-observability:
    internal: true
