services:
  apisix-etcd:
    image: ${APISIX_ETCD_IMAGE:?Définir APISIX_ETCD_IMAGE}
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=apisix-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://apisix-etcd:2379
    volumes:
      - apisix_demo_etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - apisix-control
    security_opt:
      - no-new-privileges:true

  apisix:
    image: ${APISIX_IMAGE:?Définir APISIX_IMAGE}
    restart: unless-stopped
    environment:
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?Définir APISIX_ADMIN_KEY}
      KEYCLOAK_APISIX_CLIENT_SECRET: ${KEYCLOAK_APISIX_CLIENT_SECRET:?Définir KEYCLOAK_APISIX_CLIENT_SECRET}
    volumes:
      - ${AUTOSTACK_APISIX_DIR:-..}/APISIX_demo_v3.18.0/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports:
      - "${APISIX_HTTP_BIND_ADDRESS:-0.0.0.0}:${APISIX_HTTP_PORT:-9080}:9080/tcp"
      - "${APISIX_HTTPS_BIND_ADDRESS:-0.0.0.0}:${APISIX_HTTPS_PORT:-9443}:9443/tcp"
      - "${APISIX_ADMIN_BIND_ADDRESS:-127.0.0.1}:${APISIX_ADMIN_PORT:-9180}:9180/tcp"
    depends_on:
      apisix-etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "apisix", "status"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - apisix-control
      - demo-management
      - demo-entry
      - demo-si-entry
      - demo-internal
      - demo-partner
      - demo-observability
      - demo-identity
    security_opt:
      - no-new-privileges:true

  internal-api:
    build:
      context: ${AUTOSTACK_APISIX_DIR:-..}/scripts
      dockerfile: Dockerfile.demo-api
      args:
        DEMO_API_IMAGE: ${DEMO_API_IMAGE:-python:3.12-slim-bookworm}
    restart: unless-stopped
    user: "${DEMO_HOST_UID:-1000}:${DEMO_HOST_GID:-1000}"
    environment:
      DEMO_API_ROLE: internal
      DEMO_API_PORT: "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - demo-internal
    security_opt:
      - no-new-privileges:true

  partner-api:
    build:
      context: ${AUTOSTACK_APISIX_DIR:-..}/scripts
      dockerfile: Dockerfile.demo-api
      args:
        DEMO_API_IMAGE: ${DEMO_API_IMAGE:-python:3.12-slim-bookworm}
    restart: unless-stopped
    user: "${DEMO_HOST_UID:-1000}:${DEMO_HOST_GID:-1000}"
    environment:
      DEMO_API_ROLE: partner
      DEMO_API_PORT: "${DEMO_PARTNER_PORT:-8443}"
      DEMO_PARTNER_BACKEND_API_KEY: ${DEMO_PARTNER_BACKEND_API_KEY:?Définir DEMO_PARTNER_BACKEND_API_KEY}
      DEMO_TLS_CERT: /certs/partner-server.crt
      DEMO_TLS_KEY: /certs/partner-server.key
      DEMO_TLS_CLIENT_CA: /certs/demo-ca.crt
    volumes:
      - ${AUTOSTACK_APISIX_DIR:-..}/APISIX_demo_v3.18.0/runtime/certs/demo-ca.crt:/certs/demo-ca.crt:ro
      - ${AUTOSTACK_APISIX_DIR:-..}/APISIX_demo_v3.18.0/runtime/certs/partner-server.crt:/certs/partner-server.crt:ro
      - ${AUTOSTACK_APISIX_DIR:-..}/APISIX_demo_v3.18.0/runtime/certs/partner-server.key:/certs/partner-server.key:ro
      - ${AUTOSTACK_APISIX_DIR:-..}/APISIX_demo_v3.18.0/runtime/certs/apisix-client.crt:/certs/apisix-client.crt:ro
      - ${AUTOSTACK_APISIX_DIR:-..}/APISIX_demo_v3.18.0/runtime/certs/apisix-client.key:/certs/apisix-client.key:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,ssl,urllib.request;
          c=ssl.create_default_context(cafile='/certs/demo-ca.crt');
          c.load_cert_chain('/certs/apisix-client.crt','/certs/apisix-client.key');
          r=urllib.request.Request('https://partner-api:'+os.environ['DEMO_API_PORT']+'/health',headers={'X-Partner-Api-Key':os.environ['DEMO_PARTNER_BACKEND_API_KEY']});
          urllib.request.urlopen(r,context=c,timeout=2)"
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s
    networks:
      demo-partner:
        aliases:
          - ${DEMO_PARTNER_HOST:-backend-partenaire-a.toto.local}
    security_opt:
      - no-new-privileges:true

  keycloak-db:
    image: ${KEYCLOAK_DB_IMAGE:-postgres:17-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Définir KEYCLOAK_DB_PASSWORD}
    volumes:
      - apisix_demo_keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: ${KEYCLOAK_DB_MEMORY:-512m}
    networks:
      - demo-identity
    security_opt:
      - no-new-privileges:true

  keycloak:
    image: ${KEYCLOAK_IMAGE:?Définir KEYCLOAK_IMAGE}
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Définir KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Définir KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      APISIX_PUBLIC_URL: ${APISIX_PUBLIC_URL:-http://127.0.0.1:9080}
      KEYCLOAK_APISIX_CLIENT_SECRET: ${KEYCLOAK_APISIX_CLIENT_SECRET:?Définir KEYCLOAK_APISIX_CLIENT_SECRET}
      KEYCLOAK_PARTNER_CLIENT_SECRET: ${KEYCLOAK_PARTNER_CLIENT_SECRET:?Définir KEYCLOAK_PARTNER_CLIENT_SECRET}
      KEYCLOAK_DEMO_USER_PASSWORD: ${KEYCLOAK_DEMO_USER_PASSWORD:?Définir KEYCLOAK_DEMO_USER_PASSWORD}
    volumes:
      - ${AUTOSTACK_APISIX_DIR:-..}/APISIX_demo_v3.18.0/keycloak/autostack-realm.json:/opt/keycloak/data/import/autostack-realm.json:ro
    ports:
      - "${KEYCLOAK_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-8080}:8080/tcp"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: ${KEYCLOAK_MEMORY:-1024m}
    networks:
      - demo-management
      - demo-identity
    security_opt:
      - no-new-privileges:true

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_STACK_VERSION:-9.4.2}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_BOOTSTRAP_PASSWORD:?Définir ELASTIC_BOOTSTRAP_PASSWORD}
      ES_JAVA_OPTS: -Xms768m -Xmx768m
    mem_limit: ${ELASTICSEARCH_MEMORY:-1536m}
    volumes:
      - apisix_demo_elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_BIND_ADDRESS:-127.0.0.1}:${ELASTICSEARCH_PORT:-9200}:9200/tcp"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --user elastic:$${ELASTIC_PASSWORD} http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - demo-management
      - demo-observability

  elastic-setup:
    image: ${DEMO_API_IMAGE:-python:3.12-slim-bookworm}
    restart: "no"
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTIC_BOOTSTRAP_PASSWORD: ${ELASTIC_BOOTSTRAP_PASSWORD:?Définir ELASTIC_BOOTSTRAP_PASSWORD}
      ELASTIC_ADMIN_USERNAME: ${ELASTIC_ADMIN_USERNAME:-admin}
      ELASTIC_ADMIN_PASSWORD: ${ELASTIC_ADMIN_PASSWORD:?Définir ELASTIC_ADMIN_PASSWORD}
      ELASTIC_KIBANA_SYSTEM_PASSWORD: ${ELASTIC_KIBANA_SYSTEM_PASSWORD:?Définir ELASTIC_KIBANA_SYSTEM_PASSWORD}
      ELASTIC_LOGSTASH_USERNAME: ${ELASTIC_LOGSTASH_USERNAME:-logstash_internal}
      ELASTIC_LOGSTASH_PASSWORD: ${ELASTIC_LOGSTASH_PASSWORD:?Définir ELASTIC_LOGSTASH_PASSWORD}
    volumes:
      - ${AUTOSTACK_APISIX_DIR:-..}/scripts/setup-elastic.py:/demo/setup-elastic.py:ro
    command: ["python", "/demo/setup-elastic.py"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - demo-observability
    security_opt:
      - no-new-privileges:true

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_STACK_VERSION:-9.4.2}
    restart: unless-stopped
    environment:
      LS_JAVA_OPTS: -Xms384m -Xmx384m
      XPACK_MONITORING_ENABLED: "false"
      ELASTIC_LOGSTASH_USERNAME: ${ELASTIC_LOGSTASH_USERNAME:-logstash_internal}
      ELASTIC_LOGSTASH_PASSWORD: ${ELASTIC_LOGSTASH_PASSWORD:?Définir ELASTIC_LOGSTASH_PASSWORD}
    mem_limit: ${LOGSTASH_MEMORY:-768m}
    volumes:
      - ${AUTOSTACK_APISIX_DIR:-..}/APISIX_demo_v3.18.0/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      elastic-setup:
        condition: service_completed_successfully
    networks:
      - demo-observability

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_STACK_VERSION:-9.4.2}
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${ELASTIC_KIBANA_SYSTEM_PASSWORD:?Définir ELASTIC_KIBANA_SYSTEM_PASSWORD}
      XPACK_SECURITY_ENABLED: "true"
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_SECURITY_ENCRYPTION_KEY:?Définir KIBANA_SECURITY_ENCRYPTION_KEY}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_SAVED_OBJECTS_ENCRYPTION_KEY:?Définir KIBANA_SAVED_OBJECTS_ENCRYPTION_KEY}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_REPORTING_ENCRYPTION_KEY:?Définir KIBANA_REPORTING_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
    mem_limit: ${KIBANA_MEMORY:-1024m}
    ports:
      - "${KIBANA_BIND_ADDRESS:-127.0.0.1}:${KIBANA_PORT:-5601}:5601/tcp"
    depends_on:
      elastic-setup:
        condition: service_completed_successfully
    networks:
      - demo-management
      - demo-observability

  partner-client:
    image: ${DEMO_API_IMAGE:-python:3.12-slim-bookworm}
    profiles: ["tools"]
    restart: "no"
    environment:
      TARGET_URL: http://apisix:9080/api/interne/orders
      API_KEY: ${DEMO_PARTNER_API_KEY:?Définir DEMO_PARTNER_API_KEY}
      EXPECTED_STATUS: "200"
    volumes:
      - ${AUTOSTACK_APISIX_DIR:-..}/scripts/client.py:/demo/client.py:ro
    entrypoint: ["python", "/demo/client.py"]
    networks:
      - demo-entry
    security_opt:
      - no-new-privileges:true

  si-client:
    image: ${DEMO_API_IMAGE:-python:3.12-slim-bookworm}
    profiles: ["tools"]
    restart: "no"
    environment:
      TARGET_URL: http://apisix:9080/partenaire-a/status
      API_KEY: ${DEMO_INTERNAL_API_KEY:?Définir DEMO_INTERNAL_API_KEY}
      EXPECTED_STATUS: "200"
    volumes:
      - ${AUTOSTACK_APISIX_DIR:-..}/scripts/client.py:/demo/client.py:ro
    entrypoint: ["python", "/demo/client.py"]
    networks:
      - demo-si-entry
    security_opt:
      - no-new-privileges:true

  oidc-partner-client:
    image: ${DEMO_API_IMAGE:-python:3.12-slim-bookworm}
    profiles: ["tools"]
    restart: "no"
    environment:
      TARGET_URL: http://apisix:9080/oidc/api/interne/orders
      AUTH_MODE: oidc-client-credentials
      OIDC_TOKEN_URL: http://keycloak:8080/realms/autostack/protocol/openid-connect/token
      OIDC_CLIENT_ID: autostack-partner
      OIDC_CLIENT_SECRET: ${KEYCLOAK_PARTNER_CLIENT_SECRET:?Définir KEYCLOAK_PARTNER_CLIENT_SECRET}
      EXPECTED_STATUS: "200"
    volumes:
      - ${AUTOSTACK_APISIX_DIR:-..}/scripts/client.py:/demo/client.py:ro
    entrypoint: ["python", "/demo/client.py"]
    networks:
      - demo-entry
      - demo-identity
    security_opt:
      - no-new-privileges:true

  demo-configurator:
    image: ${DEMO_API_IMAGE:-python:3.12-slim-bookworm}
    profiles: ["tools"]
    restart: "no"
    environment:
      APISIX_ADMIN_URL: http://apisix:9180
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?Définir APISIX_ADMIN_KEY}
      DEMO_PARTNER_API_KEY: ${DEMO_PARTNER_API_KEY:?Définir DEMO_PARTNER_API_KEY}
      DEMO_INTERNAL_API_KEY: ${DEMO_INTERNAL_API_KEY:?Définir DEMO_INTERNAL_API_KEY}
      DEMO_PARTNER_BACKEND_API_KEY: ${DEMO_PARTNER_BACKEND_API_KEY:?Définir DEMO_PARTNER_BACKEND_API_KEY}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      APISIX_PUBLIC_URL: ${APISIX_PUBLIC_URL:-http://127.0.0.1:9080}
      APISIX_OIDC_SESSION_SECRET: ${APISIX_OIDC_SESSION_SECRET:?Définir APISIX_OIDC_SESSION_SECRET}
      KIBANA_URL: http://kibana:5601
      KIBANA_USERNAME: ${ELASTIC_ADMIN_USERNAME:-admin}
      KIBANA_PASSWORD: ${ELASTIC_ADMIN_PASSWORD:?Définir ELASTIC_ADMIN_PASSWORD}
      LOGSTASH_URL: http://logstash:8080
    volumes:
      - ${AUTOSTACK_APISIX_DIR:-..}/scripts/bootstrap.py:/demo/bootstrap.py:ro
      - ${AUTOSTACK_APISIX_DIR:-..}/APISIX_demo_v3.18.0/runtime/generated:/demo/generated:ro
      - ${AUTOSTACK_APISIX_DIR:-..}/APISIX_demo_v3.18.0/runtime/certs/apisix-client.crt:/demo/certs/apisix-client.crt:ro
      - ${AUTOSTACK_APISIX_DIR:-..}/APISIX_demo_v3.18.0/runtime/certs/apisix-client.key:/demo/certs/apisix-client.key:ro
    command: ["python", "/demo/bootstrap.py"]
    depends_on:
      apisix:
        condition: service_healthy
      internal-api:
        condition: service_healthy
      partner-api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      elastic-setup:
        condition: service_completed_successfully
      logstash:
        condition: service_started
      kibana:
        condition: service_started
    networks:
      - demo-entry
      - demo-internal
      - demo-partner
      - demo-observability
      - demo-identity
    security_opt:
      - no-new-privileges:true

volumes:
  apisix_demo_etcd_data:
  apisix_demo_elasticsearch_data:
  apisix_demo_keycloak_db_data:

networks:
  demo-management:
  apisix-control:
    internal: true
  demo-entry:
    internal: true
  demo-si-entry:
    internal: true
  demo-internal:
    internal: true
  demo-partner:
    internal: true
  demo-observability:
    internal: true
  demo-identity:
    internal: true
