services:
################################################################ PROMETHEUS & GRAFANA ##############################################################
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - ${PROMETHEUS_PORT}:9090
    restart: unless-stopped
    volumes:
      - ${AUTOSTACK_PROM_GRAFANA_DIR:-..}/volumes/prometheus:/etc/prometheus
      - prom_data:/prometheus

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - ${GRAFANA_PORT}:3000
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER
      - GF_SECURITY_ADMIN_PASSWORD
    volumes:
      - ${AUTOSTACK_PROM_GRAFANA_DIR:-..}/volumes/grafana:/etc/grafana/provisioning/datasources
volumes:
  prom_data:
