services:
  hermes:
    image: nousresearch/hermes-agent:v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
    profiles: [manual]
    restart: "no"
    working_dir: /opt/data/workspace
    stdin_open: true
    tty: true
    environment:
      HERMES_HOME: /opt/data
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      HERMES_DASHBOARD: "0"
    command: ["--help"]
    volumes:
      - hermes_data:/opt/data
      - ${AUTOSTACK_HERMES_DIR:-..}/hermes_v2026.9.24/config/pilot.yaml:/opt/pilot.yaml:ro
      - ${AUTOSTACK_HERMES_DIR:-..}/scripts:/opt/autostack/hermes-scripts:ro
      - ${AUTOSTACK_HERMES_DIR:-..}/skills:/opt/autostack/hermes-skills:ro
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  hermes_data:
    name: autostack_hermes_data
