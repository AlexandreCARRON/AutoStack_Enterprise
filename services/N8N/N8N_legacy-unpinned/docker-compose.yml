  #******************************** N8N with POSTGRE (No specific Worker) ****************************************************************************************************

  postgres_n8n:                      #BDD posgreSQL liée à l'application N8N
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_NON_ROOT_USER
      - POSTGRES_NON_ROOT_PASSWORD
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
      - ./volumes/n8n/init-data.sh:/docker-entrypoint-initdb.d/init-data.sh:ro
    ports:
      - '127.0.0.1:${PORT_DB_N8N}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:                               #Outil puissant d'automatisation via API. Equivalent "Make" en autohébergé. Ici installé sans cloisonner les workers (à cloisonner si grande quantités à traiter)
    image: docker.n8n.io/n8nio/n8n
    restart: always
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres_n8n
      - DB_POSTGRESDB_PORT=5432             # attention a verifier conflit avec odoo postgres (FAIL 22032)
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_NON_ROOT_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-https}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-true}
      - WEBHOOK_URL=${N8N_PROTOCOL:-https}://${N8N_HOST}/
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    ports:
      - '${PORT_N8N}:5678'
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres_n8n:
        condition: service_healthy

volumes:
  n8n_db_data:
  n8n_data:
